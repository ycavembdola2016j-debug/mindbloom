<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>心花 MindBloom - 心理测评</title>
  <meta name="description" content="在喧嚣世界里，为你辟一处心灵花园">
  
  <!-- 样式 -->
  <link rel="stylesheet" href="css/styles.css">
  
  <!-- 字体 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <!-- 背景装饰 -->
  <div class="bg-decoration"></div>
  
  <!-- 应用容器 -->
  <div class="app-container">
    
    <!-- ==================== 首页 ==================== -->
    <div id="page-home" class="page home-page active">
      <div class="brand-logo">🌸</div>
      <h1 class="brand-name">心花 MindBloom</h1>
      <p class="brand-tagline">
        在喧嚣世界里<br>
        为你辟一处心灵花园<br>
        读懂自己，绽放生命
      </p>
      
      <!-- 产品卡片 -->
      <div class="product-cards">
        <!-- 意识之境 -->
        <div class="product-card" onclick="App.selectProduct('basic')">
          <div class="product-header">
            <div class="product-icon basic">🌻</div>
            <div class="product-info">
              <div class="product-name">意识之境</div>
              <div class="product-desc">30题趣味测评 · 发现你的心灵类型</div>
            </div>
            <span class="product-label basic">初级</span>
          </div>
          <button class="btn btn-primary product-btn">开始探索</button>
        </div>
        
        <!-- 心灵花园 -->
        <div class="product-card" onclick="App.selectProduct('advanced')">
          <div class="product-header">
            <div class="product-icon advanced">🌺</div>
            <div class="product-info">
              <div class="product-name">心灵花园</div>
              <div class="product-desc">200题深度测评 · MBTI + 大五人格 + 五行</div>
            </div>
            <span class="product-label advanced">高级</span>
          </div>
          <button class="btn btn-secondary product-btn">深度探索</button>
        </div>
      </div>
      
      <!-- 隐私提示 -->
      <div class="privacy-note">
        <span>🔒</span>
        <span>你的信息完全匿名</span>
      </div>
      
      <!-- 后台入口 -->
      <div class="admin-entry">
        <a href="#" class="admin-link" onclick="App.goAdmin(); return false;">
          <span>⚙️</span>
          <span>后台管理</span>
        </a>
      </div>
    </div>
    
    <!-- ==================== 体验码验证页 ==================== -->
    <div id="page-code" class="page code-page">
      <div class="header">
        <button class="back-btn" onclick="Router.back()">←</button>
        <span class="page-title">输入体验码</span>
        <div class="header-spacer"></div>
      </div>
      
      <div class="code-header">
        <div id="code-product-icon" class="code-product-icon">🌻</div>
        <h2 id="code-product-name" class="code-product-name">意识之境</h2>
        <p id="code-product-subtitle" class="code-product-subtitle">30题趣味测评</p>
      </div>
      
      <div class="code-form">
        <div class="code-inputs">
          <input type="text" class="code-input" maxlength="1" data-index="0" inputmode="numeric">
          <input type="text" class="code-input" maxlength="1" data-index="1" inputmode="numeric">
          <input type="text" class="code-input" maxlength="1" data-index="2" inputmode="numeric">
          <input type="text" class="code-input" maxlength="1" data-index="3" inputmode="numeric">
        </div>
        
        <button class="btn btn-primary" onclick="App.verifyCode()">开启探索 ✨</button>
      </div>
      
      <p class="code-hint">体验码由店主提供 · 完全匿名</p>
    </div>
    
    <!-- ==================== 信息填写页 ==================== -->
    <div id="page-info" class="page info-page">
      <div class="header">
        <button class="back-btn" onclick="Router.back()">←</button>
        <span class="page-title">填写信息</span>
        <div class="header-spacer"></div>
      </div>
      
      <div class="info-form">
        <div class="input-group">
          <label class="input-label">你的昵称</label>
          <input type="text" id="nickname" class="input-field" placeholder="怎么称呼你？" maxlength="10">
        </div>
        
        <div class="input-group">
          <label class="input-label">性别</label>
          <div class="radio-group">
            <div class="radio-item">
              <input type="radio" id="gender-male" name="gender" value="male" class="radio-input">
              <label for="gender-male" class="radio-label">男</label>
            </div>
            <div class="radio-item">
              <input type="radio" id="gender-female" name="gender" value="female" class="radio-input">
              <label for="gender-female" class="radio-label">女</label>
            </div>
            <div class="radio-item">
              <input type="radio" id="gender-other" name="gender" value="other" class="radio-input">
              <label for="gender-other" class="radio-label">其他</label>
            </div>
          </div>
        </div>
        
        <div class="input-group">
          <label class="input-label">年龄段</label>
          <div class="radio-group">
            <div class="radio-item">
              <input type="radio" id="age-18" name="age" value="18-25" class="radio-input">
              <label for="age-18" class="radio-label">18-25</label>
            </div>
            <div class="radio-item">
              <input type="radio" id="age-26" name="age" value="26-35" class="radio-input">
              <label for="age-26" class="radio-label">26-35</label>
            </div>
            <div class="radio-item">
              <input type="radio" id="age-36" name="age" value="36-45" class="radio-input">
              <label for="age-36" class="radio-label">36-45</label>
            </div>
            <div class="radio-item">
              <input type="radio" id="age-46" name="age" value="46+" class="radio-input">
              <label for="age-46" class="radio-label">46+</label>
            </div>
          </div>
        </div>
        
        <button class="btn btn-primary mt-3" onclick="App.startQuiz()">开始测评</button>
      </div>
    </div>
    
    <!-- ==================== 答题页 ==================== -->
    <div id="page-quiz" class="page quiz-page">
      <div class="header">
        <button class="back-btn" onclick="QuizEngine.goBack()">←</button>
        <span class="page-title">测评中</span>
        <div class="header-spacer"></div>
      </div>
      
      <div class="quiz-progress">
        <div class="progress-bar">
          <div id="progress-fill" class="progress-fill" style="width: 0%"></div>
        </div>
        <div id="progress-text" class="progress-text">第 1/30 题</div>
      </div>
      
      <div class="quiz-card">
        <div id="question-number" class="question-number">Question 1</div>
        <h3 id="question-text" class="question-text">题目加载中...</h3>
        <div id="options-list" class="options-list">
          <!-- 选项将动态生成 -->
        </div>
      </div>
    </div>
    
    <!-- ==================== 结果页 ==================== -->
    <div id="page-result" class="page result-page">
      <div class="header">
        <button class="back-btn" onclick="Router.goHome()">←</button>
        <span class="page-title">测评结果</span>
        <div class="header-spacer"></div>
      </div>
      
      <div class="result-card">
        <div id="result-emoji" class="result-emoji">🌻</div>
        <h2 id="result-type" class="result-type">向日葵型</h2>
        <p id="result-subtitle" class="result-subtitle">你的心灵花语：向日葵</p>
        
        <!-- AI明信片 -->
        <div id="postcard-container" class="postcard-container">
          <!-- Canvas将在这里生成 -->
        </div>
        
        <!-- 洞察卡片 -->
        <div class="insights-section">
          <h3 class="insights-title">你的心灵特质</h3>
          <div id="insights-list">
            <!-- 洞察卡片将动态生成 -->
          </div>
        </div>
        
        <!-- 操作按钮 -->
        <div class="result-actions">
          <button class="btn btn-primary" onclick="App.savePostcard()">保存明信片</button>
          <button class="btn btn-outline" onclick="App.shareResult()">分享结果</button>
          <button class="btn btn-outline" onclick="Router.goHome()">返回首页</button>
        </div>
      </div>
    </div>
    
    <!-- ==================== 后台管理页 ==================== -->
    <div id="page-admin" class="page admin-page">
      <div class="header">
        <button class="back-btn" onclick="Router.goHome()">←</button>
        <span class="page-title">后台管理</span>
        <div class="header-spacer"></div>
      </div>
      
      <!-- 登录表单 -->
      <div id="admin-login" class="admin-login-form">
        <h3 style="text-align: center; margin-bottom: 24px; color: var(--text-primary);">管理员登录</h3>
        <div class="input-group">
          <label class="input-label">密码</label>
          <input type="password" id="admin-password" class="input-field" placeholder="请输入密码">
        </div>
        <button class="btn btn-primary mt-2" onclick="Admin.login()">登录</button>
      </div>
      
      <!-- 管理面板 -->
      <div id="admin-panel" class="admin-panel hidden">
        <!-- 标签页 -->
        <div class="admin-tabs">
          <button class="admin-tab active" data-tab="generate" onclick="Admin.switchTab('generate')">生成码</button>
          <button class="admin-tab" data-tab="codes" onclick="Admin.switchTab('codes')">体验码</button>
          <button class="admin-tab" data-tab="stats" onclick="Admin.switchTab('stats')">统计</button>
        </div>
        
        <!-- 生成体验码 -->
        <div id="tab-generate" class="admin-content">
          <div class="input-group">
            <label class="input-label">产品类型</label>
            <select id="generate-product" class="input-field">
              <option value="basic">意识之境（初级版）</option>
              <option value="advanced">心灵花园（高级版）</option>
            </select>
          </div>
          
          <div class="input-group">
            <label class="input-label">生成数量</label>
            <input type="number" id="generate-count" class="input-field" value="5" min="1" max="100">
          </div>
          
          <button class="btn btn-primary" onclick="Admin.generateCodes()">生成体验码</button>
          
          <div id="generated-codes" class="code-list mt-3">
            <!-- 生成的体验码将显示在这里 -->
          </div>
        </div>
        
        <!-- 体验码列表 -->
        <div id="tab-codes" class="admin-content hidden">
          <div class="input-group">
            <select id="code-filter" class="input-field" onchange="Admin._updateCodeList()">
              <option value="all">全部</option>
              <option value="unused">未使用</option>
              <option value="active">使用中</option>
              <option value="expired">已过期</option>
            </select>
          </div>
          
          <div id="code-list" class="code-list">
            <!-- 体验码列表将显示在这里 -->
          </div>
          
          <button class="btn btn-outline mt-2" onclick="Admin.clearExpired()">清理过期码</button>
        </div>
        
        <!-- 统计数据 -->
        <div id="tab-stats" class="admin-content hidden">
          <div class="stats-grid">
            <div class="stat-card">
              <div id="stat-total" class="stat-value">0</div>
              <div class="stat-label">总体验码</div>
            </div>
            <div class="stat-card">
              <div id="stat-unused" class="stat-value">0</div>
              <div class="stat-label">未使用</div>
            </div>
            <div class="stat-card">
              <div id="stat-active" class="stat-value">0</div>
              <div class="stat-label">使用中</div>
            </div>
            <div class="stat-card">
              <div id="stat-expired" class="stat-value">0</div>
              <div class="stat-label">已过期</div>
            </div>
          </div>
        </div>
        
        <button class="btn btn-outline mt-3" onclick="Admin.logout()">退出登录</button>
      </div>
    </div>
    
  </div>
  
  <!-- 脚本加载 -->
  <script src="js/config.js"></script>
  <script src="data/questions-basic.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/state.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/code-manager.js"></script>
  <script src="js/result-engine.js"></script>
  <script src="js/ai-postcard.js"></script>
  <script src="js/quiz-engine.js"></script>
  <script src="js/admin.js"></script>
  <script src="js/router.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
