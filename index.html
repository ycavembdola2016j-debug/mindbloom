<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>心花 MindBloom - 心理测评</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <!-- 首页 -->
  <div id="page-home" class="page">
    <div class="home-container">
      <div class="logo">
        <span class="logo-icon">🌸</span>
        <h1>心花 MindBloom</h1>
        <p class="tagline">探索内心，发现真实的自己</p>
      </div>
      
      <div class="products">
        <div class="product-card" data-product="basic" onclick="App.selectProduct('basic')">
          <div class="product-icon">🌻</div>
          <h3>意识之境</h3>
          <p class="product-desc">30题趣味测评</p>
          <p class="product-sub">发现你的心灵类型</p>
          <button class="btn-primary">开始探索</button>
        </div>
        
        <div class="product-card" data-product="advanced" onclick="App.selectProduct('advanced')">
          <div class="product-icon">🌺</div>
          <h3>心灵花园</h3>
          <p class="product-desc">200题深度测评</p>
          <p class="product-sub">MBTI + 大五人格 + 五行</p>
          <button class="btn-primary">深度探索</button>
        </div>
      </div>
      
      <div class="admin-entry">
        <a href="#" onclick="App.goToAdminLogin(); return false;">后台管理</a>
      </div>
    </div>
  </div>

  <!-- 体验码验证页 -->
  <div id="page-verify" class="page">
    <div class="page-header">
      <button class="btn-back" onclick="Router.navigate('home')">←</button>
      <h2>输入体验码</h2>
    </div>
    <div class="page-content">
      <div class="verify-container">
        <div class="product-info" id="verify-product-info">
          <span class="product-icon" id="verify-icon">🌻</span>
          <h3 id="verify-product-name">意识之境</h3>
        </div>
        
        <div class="code-input-wrapper">
          <input 
            type="text" 
            id="code-input" 
            class="code-input" 
            placeholder="请输入5位体验码（如 B5586）"
            maxlength="5"
            oninput="this.value = this.value.toUpperCase()"
          >
        </div>
        
        <p class="code-hint">体验码格式：B开头=初级版，A开头=高级版</p>
        <p class="error-message" id="verify-error"></p>
        
        <button class="btn-primary btn-large" onclick="App.verifyCode()">验证并继续</button>
      </div>
    </div>
  </div>

  <!-- 信息填写页 -->
  <div id="page-profile" class="page">
    <div class="page-header">
      <button class="btn-back" onclick="Router.navigate('verify')">←</button>
      <h2>填写信息</h2>
    </div>
    <div class="page-content">
      <div class="profile-container">
        <div class="form-group">
          <label>昵称</label>
          <input type="text" id="profile-nickname" placeholder="请输入你的昵称">
        </div>
        
        <div class="form-group">
          <label>性别</label>
          <div class="gender-options">
            <button class="gender-btn" data-value="male" onclick="App.selectGender('male')">男</button>
            <button class="gender-btn" data-value="female" onclick="App.selectGender('female')">女</button>
            <button class="gender-btn" data-value="other" onclick="App.selectGender('other')">其他</button>
          </div>
        </div>
        
        <div class="form-group">
          <label>年龄段</label>
          <select id="profile-age">
            <option value="">请选择</option>
            <option value="18-25">18-25岁</option>
            <option value="26-35">26-35岁</option>
            <option value="36-45">36-45岁</option>
            <option value="46+">46岁以上</option>
          </select>
        </div>
        
        <p class="privacy-note">🔒 你的信息完全匿名，仅用于生成个性化报告</p>
        
        <button class="btn-primary btn-large" onclick="App.startQuiz()">开始答题</button>
      </div>
    </div>
  </div>

  <!-- 答题页 -->
  <div id="page-quiz" class="page">
    <div class="page-header">
      <button class="btn-back" id="quiz-back-btn" onclick="App.goBackInQuiz()">←</button>
      <div class="quiz-progress">
        <span id="quiz-current">1</span> / <span id="quiz-total">30</span>
      </div>
      <div class="progress-bar">
        <div class="progress-fill" id="quiz-progress-fill"></div>
      </div>
    </div>
    <div class="page-content">
      <div class="quiz-container">
        <div class="question-box">
          <h3 id="question-text" class="question-text">题目加载中...</h3>
        </div>
        
        <div class="options-list" id="options-list">
          <!-- 选项由 JS 动态生成 -->
        </div>
      </div>
    </div>
  </div>

  <!-- 结果页 -->
  <div id="page-result" class="page">
    <div class="page-header">
      <button class="btn-back" onclick="App.goHome()">←</button>
      <h2>你的心灵洞察</h2>
    </div>
    <div class="page-content">
      <div class="result-container">
        <!-- 结果内容区 -->
        <div id="result-content">
          <div class="result-header">
            <div class="result-emoji" id="result-emoji">🌸</div>
            <h3 class="result-name" id="result-name">加载中...</h3>
            <p class="result-subtitle" id="result-subtitle">...</p>
          </div>
          
          <!-- AI明信片区域（初级版） -->
          <div id="ai-postcard-section" style="display: none;">
            <div id="postcard-loading" class="loading">
              <div class="spinner"></div>
              <p>正在生成你的专属明信片...</p>
            </div>
            <div id="postcard-container" style="display: none;">
              <img id="postcard-image" alt="AI明信片">
              <p class="postcard-desc" id="postcard-desc"></p>
            </div>
          </div>
          
          <!-- 洞察卡片 -->
          <div class="insight-cards" id="insight-cards">
            <!-- 由 JS 生成 -->
          </div>
        </div>
        
        <div class="result-actions">
          <button class="btn-primary" id="btn-save-result" onclick="App.saveResult()">保存结果</button>
          <button class="btn-secondary" onclick="App.goHome()">返回首页</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 后台登录页 -->
  <div id="page-admin-login" class="page">
    <div class="page-header">
      <button class="btn-back" onclick="Router.navigate('home')">←</button>
      <h2>后台管理</h2>
    </div>
    <div class="page-content">
      <div class="admin-login-container">
        <div class="lock-icon">🔐</div>
        <h3>请输入管理密码</h3>
        <input 
          type="password" 
          id="admin-password" 
          class="password-input"
          placeholder="请输入密码"
        >
        <p class="error-message" id="admin-error"></p>
        <button class="btn-primary btn-large" onclick="App.loginAdmin()">登录</button>
      </div>
    </div>
  </div>

  <!-- 后台管理页 -->
  <div id="page-admin" class="page">
    <div class="page-header">
      <h2>后台管理</h2>
      <button class="btn-text" onclick="App.logoutAdmin()">退出</button>
    </div>
    <div class="page-content">
      <div class="admin-container">
        <!-- 统计卡片 -->
        <div class="stats-cards">
          <div class="stat-card">
            <h4>总测评次数</h4>
            <p class="stat-number" id="stat-total">0</p>
          </div>
          <div class="stat-card">
            <h4>初级版</h4>
            <p class="stat-number" id="stat-basic">0</p>
          </div>
          <div class="stat-card">
            <h4>高级版</h4>
            <p class="stat-number" id="stat-advanced">0</p>
          </div>
        </div>
        
        <!-- 生成体验码 -->
        <div class="admin-section">
          <h3>生成体验码</h3>
          <div class="generate-form">
            <select id="gen-product">
              <option value="basic">意识之境（初级版）</option>
              <option value="advanced">心灵花园（高级版）</option>
            </select>
            <select id="gen-count">
              <option value="1">1个</option>
              <option value="5">5个</option>
              <option value="10">10个</option>
            </select>
            <button class="btn-primary" onclick="App.generateCodes()">生成</button>
          </div>
          <div class="generated-codes" id="generated-codes"></div>
        </div>
        
        <!-- 最近记录 -->
        <div class="admin-section">
          <h3>最近记录</h3>
          <div class="records-list" id="records-list">
            <!-- 由 JS 生成 -->
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Toast 提示 -->
  <div id="toast" class="toast"></div>

  <!-- 加载核心模块 -->
  <script src="js/storage.js"></script>
  <script src="js/state.js"></script>
  <script src="js/router.js"></script>
  <script src="js/code-manager.js"></script>
  <script src="js/quiz-engine.js"></script>
  <script src="js/result-engine.js"></script>
  <script src="js/ai-postcard.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
