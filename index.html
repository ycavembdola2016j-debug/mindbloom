<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>心花 MindBloom · 心灵花语</title>
  <style>
    /* ============ CSS VARIABLES ============ */
    :root {
      --cream: #FDF8F3;
      --cream-dark: #F5EDE4;
      --cream-mid: #EDE3D8;
      --sage: #7A9E7E;
      --sage-light: #A8C5AB;
      --sage-dark: #5A7E5E;
      --rose: #C4908A;
      --rose-light: #E8B4AE;
      --lavender: #B5A8C4;
      --gold: #D4AF6A;
      --gold-light: #EDD9A3;
      --text: #4A3F35;
      --text-light: #7A6E62;
      --text-muted: #A89E90;
      --bg: #1A1512;
      --bg2: #231D18;
      --bg3: #2E2620;
      --glass: rgba(253, 248, 243, 0.05);
      --glass2: rgba(253, 248, 243, 0.08);
      --border: rgba(253, 248, 243, 0.1);
      --border2: rgba(253, 248, 243, 0.15);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      font-family: 'PingFang SC', 'Microsoft YaHei', 'STKaiti', 'KaiTi', serif;
      background: var(--bg);
      color: var(--cream);
      overflow-x: hidden;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    /* ============ NIGHT SKY BACKGROUND ============ */
    .night-sky {
      position: fixed; inset: 0; z-index: 0;
      background: radial-gradient(ellipse at 30% 20%, #1C1430 0%, #0F1A1A 40%, #0A0E0A 100%);
      overflow: hidden;
    }
    .stars { position: absolute; inset: 0; }
    .star {
      position: absolute; width: 2px; height: 2px; border-radius: 50%;
      background: white; opacity: 0.6; animation: twinkle 3s ease-in-out infinite;
    }
    @keyframes twinkle { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }
    .page { display: none; flex-direction: column; align-items: center; min-height: 100vh; padding: 20px 20px 40px; position: relative; z-index: 1; }
    .page.active { display: flex; }

    /* ============ TYPOGRAPHY ============ */
    .brand-mystic { text-align: center; margin: 40px 0 20px; }
    .mystic-symbol { font-size: 48px; margin-bottom: 8px; animation: float 3s ease-in-out infinite; }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
    .brand-title { font-size: 36px; font-weight: 300; letter-spacing: 8px; color: var(--cream); }
    .brand-sub { font-size: 11px; letter-spacing: 4px; color: var(--sage-light); margin-top: 4px; opacity: 0.8; }
    .page-title { font-size: 24px; font-weight: 300; letter-spacing: 4px; text-align: center; margin: 30px 0 10px; }
    .page-sub { font-size: 13px; color: rgba(253,248,243,0.5); text-align: center; }

    /* ============ PRODUCT CARDS ============ */
    .product-grid { display: flex; flex-direction: column; gap: 16px; width: 100%; max-width: 380px; margin: 20px 0; }
    .product-card {
      background: var(--glass2); border: 1px solid var(--border); border-radius: 20px;
      padding: 24px; cursor: pointer; transition: all 0.3s ease;
    }
    .product-card:active { transform: scale(0.98); }
    .product-card:hover { border-color: var(--sage); }
    .product-icon { font-size: 40px; margin-bottom: 12px; }
    .product-name { font-size: 18px; font-weight: 600; margin-bottom: 4px; }
    .product-desc { font-size: 13px; color: rgba(253,248,243,0.6); margin-bottom: 12px; line-height: 1.5; }
    .product-meta { display: flex; justify-content: space-between; align-items: center; }
    .product-price { font-size: 20px; color: var(--gold); font-weight: 600; }
    .product-questions { font-size: 12px; color: rgba(253,248,243,0.4); }
    .product-tag {
      display: inline-block; padding: 4px 10px; border-radius: 20px;
      font-size: 11px; background: var(--sage); color: var(--cream);
    }
    .product-tag.basic { background: var(--sage); }
    .product-tag.advanced { background: var(--lavender); }

    /* ============ COMING SOON CARD ============ */
    .coming-soon-card {
      background: linear-gradient(135deg, rgba(212,175,106,0.1), rgba(184,168,196,0.1));
      border: 1px dashed var(--gold); border-radius: 20px;
      padding: 24px; text-align: center; width: 100%; max-width: 380px; margin-top: 20px;
    }
    .coming-soon-icon { font-size: 32px; margin-bottom: 12px; animation: pulse 2s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: 0.6; } 50% { opacity: 1; } }
    .coming-soon-title { font-size: 16px; color: var(--gold); margin-bottom: 8px; }
    .coming-soon-desc { font-size: 12px; color: rgba(253,248,243,0.5); }

    /* ============ VERIFY PAGE ============ */
    .verify-card {
      background: var(--glass2); border: 1px solid var(--border); border-radius: 24px;
      padding: 32px 24px; width: 100%; max-width: 340px; text-align: center; margin-top: 20px;
    }
    .product-badge { display: inline-block; padding: 6px 14px; border-radius: 20px; font-size: 12px; margin-bottom: 16px; }
    .product-badge.basic { background: var(--sage); }
    .product-badge.advanced { background: var(--lavender); }
    .code-input-wrap { display: flex; justify-content: center; gap: 10px; margin: 20px 0; }
    .code-digit {
      width: 52px; height: 60px; background: var(--glass); border: 1px solid var(--border);
      border-radius: 12px; font-size: 24px; text-align: center; color: var(--cream);
      font-family: inherit; outline: none; transition: border-color 0.2s;
    }
    .code-digit:focus { border-color: var(--sage); }
    .code-digit.error { border-color: var(--rose); animation: shake 0.3s ease; }
    @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
    .code-error-msg { color: var(--rose); font-size: 13px; min-height: 20px; margin-bottom: 10px; }
    .btn-verify {
      width: 100%; padding: 14px; border: none; border-radius: 14px;
      background: linear-gradient(135deg, var(--sage-dark), var(--sage));
      color: var(--cream); font-size: 15px; font-weight: 600; cursor: pointer;
      font-family: inherit; letter-spacing: 2px; transition: transform 0.15s;
    }
    .btn-verify:active { transform: scale(0.97); }
    .verify-note { font-size: 12px; color: rgba(253,248,243,0.3); margin-top: 16px; }
    .cooldown-msg { padding: 20px; text-align: center; color: rgba(253,248,243,0.6); line-height: 1.8; }

    /* ============ USER INFO PAGE ============ */
    .userinfo-card {
      background: var(--glass2); border: 1px solid var(--border); border-radius: 18px;
      padding: 24px; width: 100%; max-width: 340px; display: flex; flex-direction: column; gap: 18px;
    }
    .form-label { font-size: 13px; color: rgba(253,248,243,0.6); margin-bottom: 8px; display: block; }
    .form-input {
      width: 100%; padding: 12px 15px; background: var(--glass); border: 1px solid var(--border);
      border-radius: 12px; font-size: 14px; color: var(--cream); font-family: inherit;
      outline: none; transition: border-color 0.2s;
    }
    .form-input:focus { border-color: var(--sage); }
    .form-input::placeholder { color: rgba(253,248,243,0.25); }
    .option-row { display: flex; gap: 10px; }
    .option-btn {
      flex: 1; padding: 12px; background: var(--glass); border: 1px solid var(--border);
      border-radius: 12px; font-size: 14px; color: var(--cream); cursor: pointer;
      font-family: inherit; transition: all 0.2s;
    }
    .option-btn.selected { background: linear-gradient(135deg, var(--gold), var(--gold-light)); color: var(--bg); border-color: transparent; }
    .age-grid { display: flex; flex-wrap: wrap; gap: 8px; }
    .age-btn {
      padding: 8px 12px; background: var(--glass); border: 1px solid var(--border);
      border-radius: 8px; font-size: 12px; color: var(--cream); cursor: pointer;
      font-family: inherit; transition: all 0.2s;
    }
    .age-btn.selected { background: linear-gradient(135deg, var(--gold), var(--gold-light)); color: var(--bg); border-color: transparent; }
    .privacy-note {
      padding: 14px; background: rgba(122,158,126,0.08); border-radius: 12px;
      font-size: 12px; color: rgba(253,248,243,0.4); line-height: 1.6; text-align: center;
    }
    .btn-start {
      width: 100%; padding: 14px; border: none; border-radius: 14px;
      background: linear-gradient(135deg, var(--gold-dark, #B8944A), var(--gold));
      color: var(--bg); font-size: 15px; font-weight: 600; cursor: pointer;
      font-family: inherit; letter-spacing: 2px; transition: transform 0.15s;
    }
    .btn-start:active { transform: scale(0.97); }

    /* ============ QUIZ PAGE ============ */
    #page-quiz { padding-top: 20px; }
    .progress-header { width: 100%; max-width: 380px; display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
    .back-btn {
      width: 36px; height: 36px; background: var(--glass2); border: 1px solid var(--border);
      border-radius: 50%; display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-size: 18px; color: var(--cream); transition: all 0.2s;
    }
    .back-btn:active { transform: scale(0.9); }
    .progress-text { font-size: 14px; color: rgba(253,248,243,0.7); flex: 1; text-align: center; }
    .progress-bar-wrap { width: 100%; max-width: 380px; height: 4px; background: var(--glass); border-radius: 2px; margin-bottom: 20px; }
    .progress-bar { height: 100%; background: linear-gradient(90deg, var(--sage-dark), var(--sage)); border-radius: 2px; transition: width 0.3s ease; }
    .question-card {
      background: var(--glass2); border: 1px solid var(--border); border-radius: 24px;
      padding: 28px 24px; width: 100%; max-width: 380px; animation: softSlideUp 0.4s ease;
    }
    @keyframes softSlideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    .q-category { font-size: 11px; color: var(--sage-light); letter-spacing: 2px; margin-bottom: 14px; text-transform: uppercase; }
    .q-text { font-size: 17px; line-height: 1.7; margin-bottom: 24px; min-height: 60px; }
    .options { display: flex; flex-direction: column; gap: 10px; }
    .option-btn {
      display: flex; align-items: center; gap: 12px; padding: 14px 16px;
      background: var(--glass); border: 1px solid var(--border); border-radius: 14px;
      cursor: pointer; transition: all 0.2s; text-align: left;
    }
    .option-btn:active { transform: scale(0.98); }
    .option-btn.selected { background: rgba(122,158,126,0.2); border-color: var(--sage); }
    .option-dot { font-size: 18px; color: rgba(253,248,243,0.4); transition: all 0.2s; }
    .option-btn.selected .option-dot { color: var(--sage); }
    .option-text { font-size: 14px; line-height: 1.5; flex: 1; }
    .quiz-next-btn {
      width: 100%; max-width: 380px; padding: 14px; margin-top: 20px;
      background: linear-gradient(135deg, var(--sage-dark) 0%, var(--sage) 100%);
      border: none; border-radius: 14px; font-size: 14px; font-weight: 600; color: var(--cream);
      cursor: pointer; opacity: 0; pointer-events: none; transition: all 0.3s;
      font-family: inherit; letter-spacing: 1px;
    }
    .quiz-next-btn.visible { opacity: 1; pointer-events: all; }
    .quiz-next-btn:active { transform: scale(0.97); }

    /* ============ RESULT PAGE ============ */
    #page-result { padding-bottom: 60px; }
    .result-card {
      background: linear-gradient(135deg, var(--bg2), var(--bg3));
      border: 1px solid var(--border2); border-radius: 24px;
      padding: 32px 24px; width: 100%; max-width: 400px; text-align: center;
      animation: bloomIn 0.8s ease;
    }
    @keyframes bloomIn { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
    .result-icon { font-size: 64px; margin-bottom: 20px; }
    .result-title { font-size: 22px; font-weight: 600; margin-bottom: 8px; }
    .result-subtitle { font-size: 14px; color: rgba(253,248,243,0.6); margin-bottom: 24px; }
    .result-quote {
      background: var(--glass); border-radius: 16px; padding: 20px; margin-bottom: 20px;
      font-size: 15px; line-height: 1.8; font-style: italic; color: var(--cream);
    }
    .result-image {
      width: 100%; height: 200px; object-fit: cover; border-radius: 16px; margin-bottom: 20px;
    }
    .result-tags { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-bottom: 24px; }
    .result-tag { padding: 6px 12px; background: var(--glass2); border-radius: 20px; font-size: 12px; color: var(--cream); }
    .btn-save {
      width: 100%; padding: 14px; border: none; border-radius: 14px;
      background: linear-gradient(135deg, var(--sage-dark), var(--sage));
      color: var(--cream); font-size: 14px; font-weight: 600; cursor: pointer;
      font-family: inherit; margin-bottom: 10px; transition: transform 0.15s;
    }
    .btn-save:active { transform: scale(0.97); }
    .btn-retry {
      width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 14px;
      background: transparent; color: rgba(253,248,243,0.6); font-size: 13px; cursor: pointer;
      font-family: inherit; transition: all 0.2s;
    }
    .btn-retry:active { background: var(--glass); }

    /* ============ ADVANCED RESULT ============ */
    .dimension-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
    .dimension-item { background: var(--glass); border-radius: 12px; padding: 14px; text-align: center; }
    .dimension-label { font-size: 11px; color: rgba(253,248,243,0.5); margin-bottom: 6px; }
    .dimension-value { font-size: 18px; font-weight: 600; color: var(--sage-light); }
    .dimension-bar { height: 4px; background: var(--border); border-radius: 2px; margin-top: 8px; overflow: hidden; }
    .dimension-fill { height: 100%; background: linear-gradient(90deg, var(--sage-dark), var(--sage)); border-radius: 2px; }
    .result-section { background: var(--glass); border-radius: 16px; padding: 16px; margin-bottom: 16px; text-align: left; }
    .result-section-title { font-size: 13px; color: var(--gold); margin-bottom: 10px; font-weight: 600; }
    .result-section-content { font-size: 13px; line-height: 1.7; color: rgba(253,248,243,0.8); }

    /* ============ ADMIN ============ */
    #page-admin { padding-top: 50px; }
    .admin-login { display: flex; flex-direction: column; gap: 12px; }
    .admin-input {
      background: var(--glass2); border: 1px solid var(--border); border-radius: 12px;
      padding: 12px 15px; font-size: 14px; color: var(--cream); font-family: inherit;
      outline: none; width: 100%; max-width: 280px;
    }
    .admin-input:focus { border-color: var(--sage); }
    .btn-admin-login {
      padding: 12px; background: linear-gradient(135deg, var(--sage-dark), var(--sage));
      border: none; border-radius: 12px; font-size: 14px; color: var(--cream);
      cursor: pointer; font-family: inherit; width: 100%; max-width: 280px;
    }
    .admin-dashboard { width: 100%; max-width: 500px; display: flex; flex-direction: column; gap: 20px; }
    .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .stat-card { background: var(--glass2); border: 1px solid var(--border); border-radius: 16px; padding: 16px; text-align: center; }
    .stat-value { font-size: 28px; font-weight: 600; color: var(--sage-light); }
    .stat-label { font-size: 12px; color: rgba(253,248,243,0.5); margin-top: 4px; }
    .sub-label { font-size: 13px; color: rgba(253,248,243,0.6); margin-bottom: 10px; }
    .admin-section { background: var(--glass2); border: 1px solid var(--border); border-radius: 16px; padding: 16px; }
    .admin-row { display: flex; gap: 8px; margin-bottom: 10px; }
    .admin-code-list { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
    .code-chip { padding: 6px 12px; background: var(--glass); border-radius: 8px; font-size: 13px; cursor: pointer; transition: all 0.2s; }
    .code-chip:hover { background: var(--border); }
    .code-chip.basic { border-left: 3px solid var(--sage); }
    .code-chip.advanced { border-left: 3px solid var(--lavender); }
    .btn-generate { padding: 10px 16px; background: linear-gradient(135deg, var(--gold-dark, #B8944A), var(--gold)); border: none; border-radius: 10px; font-size: 13px; color: var(--bg); cursor: pointer; font-family: inherit; }
    .record-list { max-height: 200px; overflow-y: auto; }
    .record-item { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--border); font-size: 12px; }
    .record-time { color: rgba(253,248,243,0.4); min-width: 60px; }
    .record-info { flex: 1; color: rgba(253,248,243,0.8); }
    .record-product { padding: 2px 8px; border-radius: 10px; font-size: 10px; }
    .record-product.basic { background: var(--sage); }
    .record-product.advanced { background: var(--lavender); }

    /* ============ TOP NAV ============ */
    .top-nav { position: fixed; top: 16px; right: 16px; z-index: 100; }
    .admin-btn {
      background: var(--glass2); border: 1px solid var(--border); border-radius: 8px;
      padding: 5px 10px; font-size: 10px; color: rgba(253,248,243,0.4); cursor: pointer; font-family: inherit;
    }

    /* ============ TOAST ============ */
    .toast {
      position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%);
      background: var(--bg3); border: 1px solid var(--border2); border-radius: 12px;
      padding: 12px 20px; font-size: 13px; z-index: 1000; animation: toastIn 0.3s ease;
    }
    @keyframes toastIn { from { opacity: 0; transform: translateX(-50%) translateY(20px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }
  </style>
</head>
<body>
  <div class="night-sky">
    <div class="stars" id="stars"></div>
  </div>

  <div class="top-nav">
    <button class="admin-btn" id="admin-btn" onclick="showAdmin()">后台</button>
  </div>

  <div id="app">
    <!-- ============ HOME PAGE ============ -->
    <div id="page-home" class="page active">
      <div class="brand-mystic">
        <div class="mystic-symbol">&#x1F338;</div>
        <div class="brand-title">心花</div>
        <div class="brand-sub">MIND BLOOM</div>
      </div>
      <p style="font-size: 14px; color: rgba(253,248,243,0.6); text-align: center; margin-bottom: 30px; line-height: 1.8; max-width: 300px;">准备好开启一场与自己对话的奇妙旅程了吗？</p>
      
      <div class="product-grid">
        <div class="product-card" onclick="selectProduct('basic')">
          <div style="text-align: center;">
            <div class="product-icon">&#x1F31F;</div>
          </div>
          <div class="product-name" style="text-align: center; margin: 12px 0 8px;">意识之境</div>
          <div class="product-desc" style="text-align: center;">30个意想不到的问题，带你发现被忽略的自己。有点准，有点有趣，有点意外。</div>
          <div style="text-align: center; margin-top: 14px;">
            <span style="display: inline-block; padding: 8px 20px; background: linear-gradient(135deg, var(--sage-dark), var(--sage)); border-radius: 20px; font-size: 13px; color: var(--cream);">开启探索 &#x2192;</span>
          </div>
        </div>
        
        <div class="product-card" onclick="selectProduct('advanced')">
          <div style="text-align: center;">
            <div class="product-icon">&#x1F33F;</div>
          </div>
          <div class="product-name" style="text-align: center; margin: 12px 0 8px;">心灵花园</div>
          <div class="product-desc" style="text-align: center;">200道深度探索，看见性格的全貌。职业方向、关系模式、生活指引……这份报告，只属于你。</div>
          <div style="text-align: center; margin-top: 14px;">
            <span style="display: inline-block; padding: 8px 20px; background: linear-gradient(135deg, var(--lavender), #C8BCD8); border-radius: 20px; font-size: 13px; color: var(--cream);">深度解读 &#x2192;</span>
          </div>
        </div>
      </div>

      <div class="coming-soon-card">
        <div class="coming-soon-icon">&#x2728;</div>
        <div class="coming-soon-title">&#x1F680; 神秘新量表 正在开发中</div>
        <div class="coming-soon-desc">更多探索自我的奇妙旅程，即将开启...</div>
      </div>
    </div>

    <!-- ============ VERIFY PAGE ============ -->
    <div id="page-verify" class="page">
      <button class="back-btn" onclick="showPage('page-home')">&#x2190;</button>
      <div class="page-title" id="verify-title">解锁探索</div>
      <div class="verify-card">
        <p style="font-size: 14px; color: rgba(253,248,243,0.7); margin-bottom: 8px;" id="verify-product-name">意识之境</p>
        <p style="font-size: 12px; color: rgba(253,248,243,0.4); margin-bottom: 20px;">输入你的专属体验码</p>
        <div class="code-input-wrap" id="code-input-wrap">
          <input class="code-digit" type="text" maxlength="1" inputmode="numeric" pattern="[0-9]" id="d1" />
          <input class="code-digit" type="text" maxlength="1" inputmode="numeric" pattern="[0-9]" id="d2" />
          <input class="code-digit" type="text" maxlength="1" inputmode="numeric" pattern="[0-9]" id="d3" />
          <input class="code-digit" type="text" maxlength="1" inputmode="numeric" pattern="[0-9]" id="d4" />
        </div>
        <div class="code-error-msg" id="code-error-msg"></div>
        <button class="btn-verify" id="btn-verify" onclick="verifyCode()">开启探索</button>
      </div>
    </div>

    <!-- ============ USER INFO PAGE ============ -->
    <div id="page-userinfo" class="page">
      <button class="back-btn" onclick="showPage('page-verify')">&#x2190;</button>
      <div class="page-title">欢迎来到心灵花园</div>
      <div class="page-sub" style="margin-bottom: 24px;">让我们更好地认识你</div>
      <div class="userinfo-card">
        <div>
          <label class="form-label">给自己取个昵称</label>
          <input class="form-input" type="text" id="user-nickname" placeholder="比如：心灵旅客" maxlength="12" />
        </div>
        <div>
          <label class="form-label">你的性别</label>

// ============================================================
function showPage(id) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo(0, 0);
}

// ============================================================
//  PRODUCT SELECTION
// ============================================================
function selectProduct(product) {
  state.product = product;
  const productName = document.getElementById('verify-product-name');
  
  if (product === 'basic') {
    productName.textContent = '意识之境';
    productName.style.color = 'var(--sage-light)';
  } else {
    productName.textContent = '心灵花园';
    productName.style.color = 'var(--lavender)';
  }
  
  // 重置验证码输入
  document.getElementById('code-input-wrap').innerHTML = `
    <input class="code-digit" type="text" maxlength="1" inputmode="numeric" pattern="[0-9]" id="d1" />
    <input class="code-digit" type="text" maxlength="1" inputmode="numeric" pattern="[0-9]" id="d2" />
    <input class="code-digit" type="text" maxlength="1" inputmode="numeric" pattern="[0-9]" id="d3" />
    <input class="code-digit" type="text" maxlength="1" inputmode="numeric" pattern="[0-9]" id="d4" />
  `;
  document.getElementById('btn-verify').style.display = 'block';
  document.getElementById('code-error-msg').textContent = '';
  
  // 绑定数字输入
  setupCodeInputs();
  showPage('page-verify');
}

function setupCodeInputs() {
  const digits = ['d1', 'd2', 'd3', 'd4'];
  digits.forEach((id, i) => {
    const input = document.getElementById(id);
    if (input) {
      input.oninput = function() {
        this.value = this.value.replace(/[^0-9]/g, '');
        if (this.value && i < 3) {
          document.getElementById(digits[i + 1]).focus();
        }
      };
      input.onkeydown = function(e) {
        if (e.key === 'Backspace' && !this.value && i > 0) {
          document.getElementById(digits[i - 1]).focus();
        }
      };
    }
  });
}

// ============================================================
//  CODE VERIFICATION
// ============================================================
function verifyCode() {
  const digits = ['d1', 'd2', 'd3', 'd4'].map(id => {
    const el = document.getElementById(id);
    return el ? el.value : '';
  });
  const code = digits.join('');
  
  if (code.length < 4) {
    showCodeError('请输入完整的体验码');
    return;
  }
  
  // 存储码分产品
  const codeType = code.startsWith('B') ? 'basic' : code.startsWith('A') ? 'advanced' : null;
  const codeKey = 'mindbloom_code_' + code;
  const startTime = parseInt(localStorage.getItem(codeKey) || '0', 10);
  const now = Date.now();
  
  // 检查产品匹配
  if (codeType && codeType !== state.product) {
    showCodeError('此体验码不适用于当前产品');
    return;
  }
  
  // 检查是否过期
  if (startTime > 0) {
    const elapsed = now - startTime;
    if (elapsed >= CONFIG.CODE_VALID_MS) {
      showCodeExpired();
      return;
    }
  }
  
  // 首次使用，记录时间
  if (startTime === 0) {
    localStorage.setItem(codeKey, now.toString());
  }
  
  state.verifiedCode = code;
  state.userNickname = '';
  state.userGender = '';
  state.userAge = '';
  
  showPage('page-userinfo');
  showToast('验证成功');
}

function showCodeError(msg) {
  document.getElementById('code-error-msg').textContent = msg;
  ['d1', 'd2', 'd3', 'd4'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.classList.add('error');
  });
  setTimeout(() => {
    ['d1', 'd2', 'd3', 'd4'].forEach(id => {
      const el = document.getElementById(id);
      if (el) el.classList.remove('error');
    });
  }, 500);
}

function showCodeExpired() {
  document.getElementById('code-input-wrap').innerHTML = `
    <div class="cooldown-msg">
      此体验码已过期<br>
      <small style="color:rgba(253,248,243,0.4)">请联系店主获取新的体验码</small>
    </div>
  `;
  document.getElementById('btn-verify').style.display = 'none';
}

// ============================================================
//  QUIZ LOGIC
// ============================================================
function startQuiz() {
  state.quizAnswers = [];
  state.quizCurrentIdx = 0;
  state.mode = state.product;
  showPage('page-quiz');
  renderQuestion();
}

function getQuestions() {
  return state.product === 'basic' ? BASIC_QUESTIONS : ADVANCED_QUESTIONS;
}

function renderQuestion() {
  const questions = getQuestions();
  const idx = state.quizCurrentIdx;
  const q = questions[idx];
  const total = questions.length;
  
  document.getElementById('quiz-progress-text').textContent = `${idx + 1} / ${total}`;
  document.getElementById('quiz-progress-bar').style.width = `${((idx + 1) / total) * 100}%`;
  document.getElementById('q-category').textContent = q.category;
  document.getElementById('q-text').textContent = q.text;
  
  const optionsEl = document.getElementById('q-options');
  optionsEl.innerHTML = '';
  
  const dots = ['&#x25CB;', '&#x25C7;', '&#x25B3;', '&#x25A1;', '&#x2B22;', '&#x2B21;'];
  q.options.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.innerHTML = `<div class="option-dot">${dots[i % dots.length]}</div><span class="option-text">${opt}</span>`;
    btn.onclick = () => selectOption(i, btn);
    optionsEl.appendChild(btn);
  });
  
  const nextBtn = document.getElementById('quiz-next-btn');
  nextBtn.classList.remove('visible');
  nextBtn.textContent = idx === total - 1 ? '查看我的花语' : '继续旅程';
  
  const card = document.getElementById('question-card');
  card.style.animation = 'none';
  card.offsetHeight;
  card.style.animation = '';
}

function selectOption(optIdx, btn) {
  document.querySelectorAll('.option-btn').forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected');
  state.pendingOption = { optIdx };
  document.getElementById('quiz-next-btn').classList.add('visible');
}

function nextQuestion() {
  if (!state.pendingOption) return;
  
  state.quizAnswers.push(state.pendingOption.optIdx);
  state.pendingOption = null;
  state.quizCurrentIdx++;
  
  const questions = getQuestions();
  if (state.quizCurrentIdx >= questions.length) {
    showLoading();
    return;
  }
  
  renderQuestion();
}

function confirmExit() {
  if (confirm('确定要退出吗？进度将不会保存。')) {
    showPage('page-home');
  }
}

}

function saveSession() {
  try {
    const key = 'mindbloom_sessions_v3';
    const existing = JSON.parse(localStorage.getItem(key) || '[]');
    existing.push({
      id: state.sessionId,
      ts: Date.now(),
      code: state.verifiedCode,
      product: state.product,
      nickname: state.userNickname,
      gender: state.userGender,
      age: state.userAge,
      completed: true
    });
    if (existing.length > 500) existing.splice(0, existing.length - 500);
    localStorage.setItem(key, JSON.stringify(existing));
  } catch (e) {}
}

function restartAll() {
  state.product = null;
  state.quizAnswers = [];
  state.quizCurrentIdx = 0;
  state.verifiedCode = null;
  showPage('page-home');
}

// ============================================================
//  ADMIN
// ============================================================
function showAdmin() {
  showPage('page-admin');
  
  document.getElementById('admin-back-btn').onclick = () => {
    showPage('page-home');
  };
  
  const savedLogin = localStorage.getItem('mindbloom_admin_logged');
  if (savedLogin === 'true') {
    state.adminLoggedIn = true;
    document.getElementById('admin-login-section').style.display = 'none';
    document.getElementById('admin-dashboard').style.display = 'flex';
    renderDashboard();
  } else {
    document.getElementById('admin-login-section').style.display = 'flex';
    document.getElementById('admin-dashboard').style.display = 'none';
    document.getElementById('admin-pwd').value = '';
  }
}

function adminLogin() {
  const pwd = document.getElementById('admin-pwd').value;
  if (pwd === CONFIG.ADMIN_PASSWORD) {
    state.adminLoggedIn = true;
    localStorage.setItem('mindbloom_admin_logged', 'true');
    document.getElementById('admin-login-section').style.display = 'none';
    document.getElementById('admin-dashboard').style.display = 'flex';
    renderDashboard();
    showToast('欢迎进入后台');
  } else {
    showToast('密码错误');
  }
}

function renderDashboard() {
  const sessions = JSON.parse(localStorage.getItem('mindbloom_sessions_v3') || '[]');
  const basicCount = sessions.filter(s => s.product === 'basic').length;
  const advancedCount = sessions.filter(s => s.product === 'advanced').length;
  const totalCount = sessions.length;
  
  // 合并用户分析
  const userMap = {};
  sessions.forEach(s => {
    if (s.nickname || s.gender || s.age) {
      const key = s.nickname || '匿名';
      if (!userMap[key]) {
        userMap[key] = { nickname: s.nickname, gender: s.gender, age: s.age, products: [], count: 0 };
      }
      userMap[key].products.push(s.product);
      userMap[key].count++;
    }
  });
  
  // 找出复购用户
  const repeatUsers = Object.values(userMap).filter(u => u.count > 1);
  
  const dashboard = document.getElementById('admin-dashboard');
  dashboard.innerHTML = `
    <div class="stat-grid">
      <div class="stat-card">
        <div class="stat-value">${totalCount}</div>
        <div class="stat-label">总测评次数</div>
      </div>
      <div class="stat-card">
        <div class="stat-value">${basicCount}</div>
        <div class="stat-label">初级版</div>
      </div>
      <div class="stat-card">
        <div class="stat-value">${advancedCount}</div>
        <div class="stat-label">高级版</div>
      </div>
      <div class="stat-card">
        <div class="stat-value">${repeatUsers.length}</div>
        <div class="stat-label">复购用户</div>
      </div>
    </div>
    
    <div class="admin-section">
      <div class="sub-label">生成体验码（可复制发给买家）</div>
      <div class="admin-row">
        <button class="btn-generate" onclick="generateCode('basic')">初级版体验码</button>
        <button class="btn-generate" onclick="generateCode('advanced')">高级版体验码</button>
      </div>
      <div class="sub-label" style="margin-top:16px">最近测评记录</div>
      <div class="record-list" id="record-list"></div>
    </div>
    
    <div class="admin-section">
      <button class="btn-retry" onclick="exportData()">导出CSV数据</button>
    </div>
  `;
  
  // 渲染记录
  const recordList = document.getElementById('record-list');
  const recent = sessions.slice(-20).reverse();
  recent.forEach(s => {
    const d = new Date(s.ts);
    const dateStr = `${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
    const genderIcon = s.gender === 'M' ? '♂' : s.gender === 'F' ? '♀' : '';
    const nickname = s.nickname || '匿名';
    const age = s.age || '';
    
    const div = document.createElement('div');
    div.className = 'record-item';
    div.innerHTML = `
      <span class="record-time">${dateStr}</span>
      <span class="record-info">${nickname} ${genderIcon} ${age}</span>
      <span class="record-product ${s.product}">${s.product === 'basic' ? '初级' : '高级'}</span>
    `;
    recordList.appendChild(div);
  });
}

function generateCode(type) {
  const prefix = type === 'basic' ? 'B' : 'A';
  const code = prefix + Math.floor(1000 + Math.random() * 9000);
  
  const key = type === 'basic' ? 'mindbloom_codes_basic' : 'mindbloom_codes_advanced';
  const codes = JSON.parse(localStorage.getItem(key) || '[]');
  codes.push({ code, created: Date.now() });
  localStorage.setItem(key, JSON.stringify(codes));
  
  // 复制到剪贴板
  navigator.clipboard.writeText(code).then(() => {
    showToast(`已生成：${code}（已复制）`);
  }).catch(() => {
    showToast(`已生成：${code}`);
  });
}

function exportData() {
  const sessions = JSON.parse(localStorage.getItem('mindbloom_sessions_v3') || '[]');
  if (sessions.length === 0) {
    showToast('暂无数据可导出');
    return;
  }
  
  let csv = 'ID,时间,产品,昵称,性别,年龄\n';
  sessions.forEach(s => {
    csv += `${s.id},${new Date(s.ts).toLocaleString()},${s.product === 'basic' ? '初级版' : '高级版'},${s.nickname || ''},${s.gender || ''},${s.age || ''}\n`;
  });
  
  const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'mindbloom_data.csv';
  a.click();
  URL.revokeObjectURL(url);
  
  showToast('已导出CSV');
}

// ============================================================
//  TOAST
// ============================================================
function showToast(msg) {
  const existing = document.querySelector('.toast');
  if (existing) existing.remove();
  
  const toast = document.createElement('div');
  toast.className = 'toast';
  toast.textContent = msg;
  document.body.appendChild(toast);
  
  setTimeout(() => toast.remove(), 2500);
}

// ============================================================
//  INIT
// ============================================================
function init() {
  // 生成星星背景
  const stars = document.getElementById('stars');
  for (let i = 0; i < 80; i++) {
    const star = document.createElement('div');
    star.className = 'star';
    star.style.left = Math.random() * 100 + '%';
    star.style.top = Math.random() * 100 + '%';
    star.style.animationDelay = Math.random() * 3 + 's';
    star.style.width = star.style.height = (Math.random() * 2 + 1) + 'px';
    stars.appendChild(star);
  }
  
  // 初始化验证码输入
  setupCodeInputs();
}

// ============================================================
//  UTILS
// ============================================================
function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

// 页面加载完成后初始化
document.addEventListener('DOMContentLoaded', init);
</script>
